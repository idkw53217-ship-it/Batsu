<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Batsu — Today's Schedule</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #1a1d24;
    --accent: #5b8cff;
    --now-bg: #1e3a2e;
    --now-border: #34d399;
    --next-border: #5b8cff;
    --text-main: #f2f3f5;
    --text-dim: #9aa0ac;
    --danger: #ff6b6b;
    --radius: 14px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    min-height: 100vh;
  }

  #widget {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 16px 16px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  }

  #header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  #day-label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  #updated-label {
    font-size: 10px;
    color: var(--text-dim);
  }

  #class-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .class-item {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .class-item.now {
    background: var(--now-bg);
    border-color: var(--now-border);
  }

  .class-item.next {
    border-color: var(--next-border);
  }

  .class-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }

  .subject {
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 2px 6px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  .badge.now {
    background: var(--now-border);
    color: #06251a;
  }

  .badge.next {
    background: var(--next-border);
    color: #06122a;
  }

  .time {
    font-size: 12px;
    color: var(--text-dim);
  }

  .room {
    font-size: 11px;
    color: var(--text-dim);
  }

  #status-message {
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    padding: 18px 4px;
  }

  #error-message {
    font-size: 12px;
    color: var(--danger);
    text-align: center;
    padding: 14px 4px;
    display: none;
  }
</style>
</head>
<body>
  <div id="widget">
    <div id="header">
      <span id="day-label">—</span>
      <span id="updated-label"></span>
    </div>
    <div id="class-list"></div>
    <div id="status-message" style="display:none;"></div>
    <div id="error-message"></div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
