<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f0fb" />
<title>Batsu — Today ✦</title>
<style>
  /* Cute rounded font, with a safe system fallback if the network font
     can't load (e.g. inside an offline widget wrapper). */
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');

  :root {
    --bg-top: #f7f1ff;
    --bg-bottom: #fdf1f6;
    --card-bg: #ffffffcc;
    --card-border: #e9defc;
    --ink: #4a3f6b;
    --ink-soft: #8b81ab;
    --ink-faint: #b1a8cc;
    --accent-purple: #a48bf0;
    --accent-pink: #ff9fc7;
    --accent-mint: #7fd8b8;
    --now-bg: linear-gradient(135deg, #d9fbe9, #eafcf2);
    --now-border: #6fd3a4;
    --next-bg: linear-gradient(135deg, #fdeafd, #f3ecff);
    --next-border: #c9a6f5;
    --shadow: 0 8px 24px rgba(150, 120, 200, 0.18);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--ink);
    font-family: 'Quicksand', ui-rounded, 'SF Pro Rounded', 'Comfortaa',
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    min-height: 100vh;
  }

  #widget {
    width: 100%;
    max-width: 360px;
    background: var(--card-bg);
    backdrop-filter: blur(6px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 14px 14px 12px;
    box-shadow: var(--shadow);
  }

  #header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 0 2px;
  }

  #title-block {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }

  #brand {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: var(--accent-purple);
    text-transform: uppercase;
  }

  #day-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
  }

  #updated-label {
    font-size: 9px;
    color: var(--ink-faint);
    text-align: right;
  }

  .section {
    margin-top: 10px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-purple);
    letter-spacing: 0.3px;
    margin: 0 2px 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .section-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* --- Class items --- */
  .class-item {
    background: #fbf9ff;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .class-item.now {
    background: var(--now-bg);
    border-color: var(--now-border);
  }

  .class-item.next {
    background: var(--next-bg);
    border-color: var(--next-border);
  }

  .class-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }

  .subject {
    font-size: 13px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--ink);
  }

  .badge {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    padding: 2px 7px;
    border-radius: 999px;
    flex-shrink: 0;
    color: #fff;
  }

  .badge.now {
    background: var(--now-border);
  }

  .badge.next {
    background: var(--next-border);
  }

  .time {
    font-size: 11px;
    color: var(--ink-soft);
  }

  .room {
    font-size: 10.5px;
    color: var(--ink-faint);
  }

  /* --- Reminder items --- */
  .reminder-item {
    background: #fff8fb;
    border: 1px solid #ffe3ef;
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .reminder-text {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .reminder-when {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-pink);
    flex-shrink: 0;
    white-space: nowrap;
  }

  .reminder-when.today {
    color: #ff6f91;
  }

  /* --- Notes --- */
  .note-item {
    font-size: 12px;
    color: var(--ink-soft);
    background: #f9f6ff;
    border: 1px dashed var(--card-border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
  }

  .note-more {
    font-size: 10px;
    color: var(--ink-faint);
    text-align: center;
    margin-top: 2px;
  }

  /* --- Empty / status states --- */
  .empty-message {
    font-size: 11.5px;
    color: var(--ink-faint);
    text-align: center;
    padding: 8px 4px;
    font-style: italic;
  }

  #error-message {
    font-size: 12px;
    color: #e0688a;
    text-align: center;
    padding: 14px 4px;
    display: none;
  }

  #sparkle-footer {
    text-align: center;
    margin-top: 10px;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div id="widget">
    <div id="header">
      <div id="title-block">
        <span id="brand">✦ Batsu</span>
        <span id="day-label">—</span>
      </div>
      <span id="updated-label"></span>
    </div>

    <div class="section" id="classes-section">
      <div class="section-title">📚 Today's classes</div>
      <div class="section-list" id="class-list"></div>
    </div>

    <div class="section" id="reminders-section">
      <div class="section-title">📝 Upcoming reminders</div>
      <div class="section-list" id="reminder-list"></div>
    </div>

    <div class="section" id="notes-section">
      <div class="section-title">📌 Notes</div>
      <div class="section-list" id="note-list"></div>
    </div>

    <div id="error-message"></div>
    <div id="sparkle-footer">✦ ✦ ✦</div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
